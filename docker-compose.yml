version: "3.9"

services:
  gateway:
    build:
      context: ./gateway
    container_name: gateway
    ports:
      - "8000:8000"
    environment:
      GATEWAY_API_KEY: "client-secret-key"
      DISPATCHER_PROXY_HOST: envoy
      DISPATCHER_PROXY_PORT: "50051"
      DISPATCHER_API_KEY: "dispatcher-secret-key"
    depends_on:
      - envoy
    networks:
      - app_net



  envoy:
    image: envoyproxy/envoy:v1.32.6
    container_name: envoy
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    command: ["envoy", "-c", "/etc/envoy/envoy.yaml", "--log-level", "info"]
    ports:
      - "50051:50051"   # Gateway - Envoy - Dispatcher
      - "50052:50052"   # Dispatcher - Envoy - Worker
      - "9901:9901"     # admin UI
    depends_on:
      - dispatcher
      - worker
    networks:
      - app_net


  dispatcher:
    build:
      context: ./dispatcher
    container_name: dispatcher
    environment:
      DISPATCHER_PORT: "50051"
      DISPATCHER_API_KEY: "dispatcher-secret-key"
      WORKER_PROXY_HOST: envoy
      WORKER_PROXY_PORT: "50052"
      WORKER_API_KEY: "worker-secret-key"
      DISPATCHER_LOG: "/logs/dispatcher_logs.jsonl"
    expose:
      - "50051"
    depends_on:
      - worker
    networks:
      - app_net


  worker:
    build:
      context: ./worker
    container_name: worker
    environment:
      WORKER_PORT: "50052"
      WORKER_API_KEY: "worker-secret-key"
      WORKER_LOG: "/logs/worker_logs.jsonl"
    expose:
      - "50052"
    networks:
      - app_net

  logs:
    image: busybox
    command: ["sh", "-c", "mkdir -p /logs && sleep 3600"]
    volumes:
      - ./logs:/logs
    networks:
      - app_net

networks:
  app_net:
    driver: bridge
